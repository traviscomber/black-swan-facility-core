name = "black-swan-documents"
main = "src/index.ts"
compatibility_date = "2026-08-14"

[vars]
API_VERSION = "v1"
ENVIRONMENT = "development"

[[r2_buckets]]
binding = "DOCUMENTS_BUCKET"
bucket_name = "black-swan-documents"

[[queues.producers]]
binding = "OCR_QUEUE"
queue = "black-swan-ocr"

# Configure SUPABASE_URL and SUPABASE_ANON_KEY outside GitHub.
# Production custom domain target: documents-api.blackswn.org or api.blackswn.org routing.

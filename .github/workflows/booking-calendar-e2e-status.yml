name: Booking calendar E2E status

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/bookings/**"
      - "components/booking-calendar-*.tsx"
      - "components/use-booking-calendar-*.ts"
      - "lib/booking-*.ts"
      - "tests/e2e/booking-calendar.e2e.ts"
      - "scripts/run-booking-calendar-e2e.mjs"
      - "proxy.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/booking-calendar-e2e-status.yml"
  pull_request:
    paths:
      - "app/bookings/**"
      - "components/booking-calendar-*.tsx"
      - "components/use-booking-calendar-*.ts"
      - "lib/booking-*.ts"
      - "tests/e2e/booking-calendar.e2e.ts"
      - "scripts/run-booking-calendar-e2e.mjs"
      - "proxy.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/booking-calendar-e2e-status.yml"

permissions:
  contents: read
  statuses: write

jobs:
  calendar-interactions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Publish pending calendar E2E status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "pending",
              context: "booking-calendar-e2e",
              description: "Calendar interaction tests are running",
            })
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e:booking
      - name: Publish final calendar E2E status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const jobStatus = "${{ job.status }}"
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: jobStatus === "success" ? "success" : "failure",
              context: "booking-calendar-e2e",
              description: jobStatus === "success"
                ? "Chromium, Firefox and WebKit calendar tests passed"
                : "Booking calendar E2E tests failed",
            })

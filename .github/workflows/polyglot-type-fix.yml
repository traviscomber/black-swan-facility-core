name: Polyglot type fix

on:
  push:
    branches:
      - fix/polyglot-sitewide-en-es-de

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[polyglot-type-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/polyglot-sitewide-en-es-de
          fetch-depth: 0
      - name: Patch locale typing regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          crop = Path('app/orchard/crop-map/page.tsx')
          text = crop.read_text()
          old = 'type Copy = typeof copy.en'
          new = 'type Copy = (typeof copy)[keyof typeof copy]'
          if old not in text:
              raise SystemExit('crop-map Copy alias not found')
          crop.write_text(text.replace(old, new, 1))

          work = Path('app/orchard/work/page.tsx')
          text = work.read_text()
          marker = 'type WorkLocale = "en" | "es" | "de"\n'
          form_type = '''type WorkForm = {\n  succession_id: string\n  source_type: string\n  title: string\n  description: string\n  category: string\n  due_date: string\n  priority: Priority\n  estimated_minutes: string\n  employee_id: string\n}\n'''
          if 'type WorkForm = {' not in text:
              if marker not in text:
                  raise SystemExit('WorkLocale marker not found')
              text = text.replace(marker, marker + form_type, 1)
          old_state = 'const [form, setForm] = useState({'
          new_state = 'const [form, setForm] = useState<WorkForm>({'
          if old_state not in text and new_state not in text:
              raise SystemExit('work form state declaration not found')
          text = text.replace(old_state, new_state, 1)
          work.write_text(text)
          PY
      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "Polyglot Bot"
          git config user.email "n3uralia@gmail.com"
          git add app/orchard/crop-map/page.tsx app/orchard/work/page.tsx
          git commit -m "fix(i18n): widen Orchard locale form types [polyglot-type-fix]"
          git push origin HEAD:fix/polyglot-sitewide-en-es-de

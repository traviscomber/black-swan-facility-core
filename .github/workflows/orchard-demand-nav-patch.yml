name: Orchard demand nav patch

on:
  push:
    branches:
      - feat/orchard-demand-planner

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[demand-nav]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/orchard-demand-planner
          fetch-depth: 0
      - name: Add Demand Planner to Orchard navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('components/orchard/orchard-navigation.tsx')
          s=p.read_text()
          if 'UtensilsCrossed' not in s:
              s=s.replace('  TestTube2,\n', '  TestTube2,\n  UtensilsCrossed,\n')
          needle='      { href: "/orchard/library", label: { en: "Crop Library", es: "Biblioteca", de: "Kulturbibliothek" }, icon: BookOpen },\n'
          row='      { href: "/orchard/demand", label: { en: "Food Demand", es: "Demanda", de: "Lebensmittelbedarf" }, icon: UtensilsCrossed },\n'
          if row not in s:
              if needle not in s: raise SystemExit('Planning nav anchor not found')
              s=s.replace(needle,row+needle)
          p.write_text(s)
          PY
      - name: Commit navigation
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "Orchard Demand Bot"
          git config user.email "n3uralia@gmail.com"
          git add components/orchard/orchard-navigation.tsx
          git commit -m "feat(orchard): expose demand planner in nav [demand-nav]"
          git push origin HEAD:feat/orchard-demand-planner

name: Booking E2E pointer fix verification

on:
  push:
    branches:
      - agent/booking-e2e-pointer-fix
    paths:
      - "components/booking-calendar-*.tsx"
      - "components/use-booking-calendar-*.ts"
      - "tests/e2e/booking-calendar*.e2e.ts"
      - "scripts/run-booking-calendar-e2e.mjs"
      - ".github/workflows/booking-e2e-fix-temp.yml"

jobs:
  booking-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          E2E_CALENDAR_HARNESS=1 NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321 NEXT_PUBLIC_SUPABASE_ANON_KEY=e2e-anon-key pnpm dev --hostname 127.0.0.1 --port 3100 > /tmp/booking-next.log 2>&1 &
          for i in $(seq 1 120); do curl -fsS http://127.0.0.1:3100/bookings/e2e-harness >/dev/null && break; sleep 1; done
          node --experimental-strip-types --test tests/e2e/booking-calendar-debug.e2e.ts

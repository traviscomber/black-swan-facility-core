name: Booking E2E pointer fix verification

on:
  push:
    branches:
      - agent/booking-e2e-pointer-fix
    paths:
      - "components/booking-calendar-*.tsx"
      - "components/use-booking-calendar-*.ts"
      - "tests/e2e/booking-calendar.e2e.ts"
      - "scripts/run-booking-calendar-e2e.mjs"
      - ".github/workflows/booking-e2e-fix-temp.yml"

jobs:
  booking-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      E2E_BROWSERS: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e:booking

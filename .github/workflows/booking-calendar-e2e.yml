name: Booking calendar E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/bookings/**"
      - "components/booking-calendar-*.tsx"
      - "components/use-booking-calendar-*.ts"
      - "lib/booking-*.ts"
      - "tests/e2e/booking-calendar.e2e.ts"
      - "scripts/run-booking-calendar-e2e.mjs"
      - "proxy.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/booking-calendar-e2e.yml"
  pull_request:
    paths:
      - "app/bookings/**"
      - "components/booking-calendar-*.tsx"
      - "components/use-booking-calendar-*.ts"
      - "lib/booking-*.ts"
      - "tests/e2e/booking-calendar.e2e.ts"
      - "scripts/run-booking-calendar-e2e.mjs"
      - "proxy.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/booking-calendar-e2e.yml"

jobs:
  calendar-interactions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify Playwright runtime
        run: pnpm exec playwright --version
      - name: Run booking calendar E2E
        env:
          HOME: /root
        run: pnpm test:e2e:booking

name: Booking calendar E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/bookings/**"
      - "components/booking-calendar-*.tsx"
      - "components/use-booking-calendar-*.ts"
      - "lib/booking-*.ts"
      - "tests/e2e/booking-calendar.e2e.ts"
      - "scripts/run-booking-calendar-e2e.mjs"
      - "proxy.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/booking-calendar-e2e.yml"
  pull_request:
    paths:
      - "app/bookings/**"
      - "components/booking-calendar-*.tsx"
      - "components/use-booking-calendar-*.ts"
      - "lib/booking-*.ts"
      - "tests/e2e/booking-calendar.e2e.ts"
      - "scripts/run-booking-calendar-e2e.mjs"
      - "proxy.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/booking-calendar-e2e.yml"

jobs:
  calendar-interactions:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve Playwright version
        id: playwright-version
        shell: bash
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium firefox webkit
      - name: Install Playwright browsers and dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e:booking

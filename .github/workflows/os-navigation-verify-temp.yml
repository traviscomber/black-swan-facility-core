name: OS navigation final verification

on:
  push:
    branches:
      - agent/blackswan-os-navigation-design
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - ".github/workflows/os-navigation-verify-temp.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prebuild regression suite
        run: pnpm prebuild
      - name: Build
        run: pnpm build

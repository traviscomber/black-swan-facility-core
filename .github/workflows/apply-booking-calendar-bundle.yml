name: Apply booking calendar bundle

on:
  push:
    branches: [main]
    paths:
      - ".calendar/**"
      - ".github/workflows/apply-booking-calendar-bundle.yml"

permissions:
  contents: write
  actions: write

jobs:
  apply-calendar-bundle:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Reconstruct and verify bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .calendar/chunk-* > /tmp/calendar-bundle.b64
          base64 --decode /tmp/calendar-bundle.b64 > /tmp/calendar-bundle.tar.gz
          echo "9ef5e28fc6c9f98b15132681aa0c6a953c374ab57da6f1e31c9058aa74fa9bce  /tmp/calendar-bundle.tar.gz" | sha256sum --check
          tar -xzf /tmp/calendar-bundle.tar.gz

          base64 --decode .calendar/package-fix.b64 > /tmp/package-fix.tar.gz
          echo "7f88abf2e2233319e3fb7b1dbe5f55f1d553be296e5df7f117a375b49aaed117  /tmp/package-fix.tar.gz" | sha256sum --check
          tar -xzf /tmp/package-fix.tar.gz

          base64 --decode .calendar/e2e-fix.b64 > /tmp/e2e-fix.tar.gz
          echo "6cdca9db7c7034f9153ec95dc33111928471406fb472b0965dc2c1b0286c1938  /tmp/e2e-fix.tar.gz" | sha256sum --check
          tar -xzf /tmp/e2e-fix.tar.gz

          rm -f \
            components/booking-timeline-dom-identity.tsx \
            components/booking-timeline-drag-drop.tsx \
            components/booking-timeline-range-create.tsx
          rm -rf .calendar
          rm -f .github/workflows/apply-booking-calendar-bundle.yml

      - name: Install dependencies and refresh lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Build and run unit tests
        run: pnpm build

      - name: Install Chromium and Firefox
        run: pnpm exec playwright install --with-deps chromium firefox

      - name: Run booking calendar E2E on Linux browsers
        env:
          E2E_BROWSERS: chromium,firefox
        run: pnpm test:e2e:booking

      - name: Commit validated calendar implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete native booking calendar operations"
          git push origin HEAD:main
